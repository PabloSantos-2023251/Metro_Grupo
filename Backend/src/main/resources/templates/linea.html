<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Líneas</title>
    <link rel="stylesheet" href="../static/linea.css">
</head>

<body>
<div class="container">

    <a href="PaginaPrincipal.html" class="btn btn-secondary">← Volver</a>

    <h2>Gestión de Líneas</h2>
    <hr>

    <div class="card">
        <form id="formLineas">
            <div class="row">

                <div class="col-md-6">
                    <label class="form-label">Nombre de Línea</label>
                    <input type="text" class="form-control" placeholder="Ej: Línea 1" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Color</label>
                    <input type="text" class="form-control" placeholder="Ej: Rojo">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Longitud (km)</label>
                    <input type="number" step="0.01" class="form-control" placeholder="Ej: 12.50">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success">Guardar Línea</button>
                </div>

            </div>
        </form>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID Línea</th>
            <th>Nombre</th>
            <th>Color</th>
            <th>Longitud (km)</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>1</td>
            <td>Línea 1</td>
            <td>Rojo</td>
            <td>12.50</td>
            <td>
                <button class="btn btn-warning">Editar</button>
                <button class="btn btn-danger">Borrar</button>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Líneas - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;" th:text="${editando} ? 'Modificar Línea' : 'Gestión de Líneas'"></h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="container-fluid px-0">
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body p-4">
            <form th:action="@{/linea/guardar}" th:object="${linea}" method="post">
                <input type="hidden" th:field="*{idLinea}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre de la Línea</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-signpost-split text-primary"></i></span>
                            <input type="text" th:field="*{nombreLinea}" class="form-control" placeholder="Ej: Línea Dorada" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Color (Hex o Nombre)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-palette text-primary"></i></span>
                            <input type="text" th:field="*{color}" class="form-control" placeholder="Ej: #FFD700" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Longitud (km)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-ruler text-primary"></i></span>
                            <input type="number" step="0.1" th:field="*{longitudKm}" class="form-control" placeholder="Ej: 15.5" required>
                        </div>
                    </div>
                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${linea.idLinea != null} ? 'bi bi-arrow-repeat' : 'bi bi-floppy-fill'"></i>
                            <span th:text="${linea.idLinea != null} ? 'Actualizar Línea' : 'Guardar Línea'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/linea}" method="get" class="d-flex">
                <input type="text" name="buscar" class="form-control me-2 shadow-sm" placeholder="Buscar por nombre de línea...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/linea}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center" title="Limpiar">
                    <i class="bi bi-eraser-fill"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Nombre de Línea</th>
                <th>Representación</th>
                <th>Extensión</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${lineas}">
                <td th:text="${u.idLinea}" class="fw-bold"></td>
                <td th:text="${u.nombreLinea}"></td>
                <td>
                    <span class="badge rounded-pill shadow-sm" th:text="${u.color}"
                          th:style="'background-color:' + ${u.color} + '; color: white; border: 1px solid rgba(0,0,0,0.1); text-shadow: 1px 1px 2px rgba(0,0,0,0.5); padding: 8px 15px; font-weight: 600;'">
                    </span>
                </td>
                <td>
                    <span class="badge bg-light text-dark border"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${u.longitudKm} + ' km'"></span></span>
                </td>
                <td class="text-center">
                    <a th:href="@{/linea/editar/{id}(id=${u.idLinea})}" class="btn btn-sm btn-warning d-inline-flex align-items-center">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/linea/eliminar/{id}(id=${u.idLinea})}" class="btn btn-sm btn-danger d-inline-flex align-items-center"
                       onclick="return confirm('¿Seguro que quieres eliminar esta línea?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lineas)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontraron líneas registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

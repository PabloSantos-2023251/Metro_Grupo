<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Líneas</title>
    <link rel="stylesheet" th:href="@{/linea.css}">
</head>

<body>
<div class="container">

    <a href="PaginaPrincipal.html" class="btn btn-secondary">← Volver</a>

    <h2>Gestión de Líneas</h2>
    <hr>

    <div class="card">
        <!-- FORM CORREGIDO -->
        <form th:action="@{/linea/guardar}" th:object="${linea}" method="post">
            <div class="row">

                <!-- ID OCULTO (CLAVE PARA EDITAR) -->
                <input type="hidden" th:field="*{idLinea}">

                <div class="col-md-6">
                    <label class="form-label">Nombre de Línea</label>
                    <input type="text" class="form-control"
                           th:field="*{nombreLinea}"
                           placeholder="Ej: Línea 1" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Color</label>
                    <input type="text" class="form-control"
                           th:field="*{color}"
                           placeholder="Ej: Rojo">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Longitud (km)</label>
                    <input type="number" step="0.01" class="form-control"
                           th:field="*{longitudKm}"
                           placeholder="Ej: 12.50">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success">
                        Guardar Línea
                    </button>
                </div>

            </div>
        </form>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID Línea</th>
            <th>Nombre</th>
            <th>Color</th>
            <th>Longitud (km)</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${lineas}">
            <td th:text="${u.idLinea}"></td>
            <td th:text="${u.nombreLinea}"></td>
            <td th:text="${u.color}"></td>
            <td th:text="${u.longitudKm}"></td>
            <td>
                <a th:href="@{/linea/editar/{id}(id=${u.idLinea})}"
                   class="btn btn-warning">Editar</a>

                <a th:href="@{/linea/eliminar/{id}(id=${u.idLinea})}"
                   class="btn btn-danger"
                   onclick="return confirm('¿Seguro que quieres eliminar esta línea?')">
                    Borrar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Líneas - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0;">Gestión de Líneas</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/linea/guardar}" th:object="${linea}" method="post">
                <input type="hidden" th:field="*{idLinea}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre de Línea</label>
                        <input type="text" th:field="*{nombreLinea}" class="form-control" placeholder="Ej: Línea 1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Color Representativo</label>
                        <input type="text" th:field="*{color}" class="form-control" placeholder="Ej: Rojo o #FF0000">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Longitud (km)</label>
                        <input type="number" step="0.01" th:field="*{longitudKm}" class="form-control" placeholder="Ej: 12.5">
                    </div>
                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i class="bi bi-plus-circle-fill"></i> Guardar Línea
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/linea}" method="get" class="d-flex">
                <input type="text" name="buscar" class="form-control me-2" placeholder="Buscar por ID de Línea...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a th:href="@{/linea}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Color</th>
                <th>Longitud</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${lineas}">
                <td th:text="${u.idLinea}" class="fw-bold"></td>
                <td th:text="${u.nombreLinea}"></td>
                <td>
                        <span class="badge rounded-pill" th:text="${u.color}"
                              th:style="'background-color:' + ${u.color} + '; color: white; border: 1px solid rgba(0,0,0,0.1); text-shadow: 1px 1px 2px rgba(0,0,0,0.5);'">
                        </span>
                </td>
                <td th:text="${u.longitudKm} + ' km'"></td>
                <td class="text-center">
                    <a th:href="@{/linea/editar/{id}(id=${u.idLinea})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/linea/eliminar/{id}(id=${u.idLinea})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Seguro que quieres eliminar esta línea?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lineas)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontraron líneas con ese criterio.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

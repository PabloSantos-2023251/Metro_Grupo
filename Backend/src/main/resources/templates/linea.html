<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Líneas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/estacion.css}">
</head>

<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/Metro.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}"
           class="btn btn-secondary d-flex align-items-center gap-2"
           style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>

        <h2 style="font-weight:700;">Gestión de Líneas</h2>
    </div>

    <hr>

    <!-- ALERTA DE ERROR -->
    <div class="container-fluid px-0">
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- FORMULARIO -->
    <div class="card p-3">
        <form th:action="@{/linea/guardar}" th:object="${linea}" method="post">
            <div class="row g-3">

                <input type="hidden" th:field="*{idLinea}">

                <div class="col-md-4">
                    <input type="text" class="form-control"
                           th:field="*{nombreLinea}"
                           placeholder="Nombre de Línea" required>
                </div>

                <div class="col-md-4">
                    <input type="text" class="form-control"
                           th:field="*{color}"
                           placeholder="Color">
                </div>

                <div class="col-md-4">
                    <input type="number" step="0.01" min="0" class="form-control"
                           th:field="*{longitudKm}"
                           placeholder="Longitud (km)" required>
                </div>

                <div class="col-12 text-center">
                    <button type="submit"
                            class="btn btn-metro-main w-100 py-2 d-flex justify-content-center gap-2">
                        <i class="bi bi-floppy-fill"></i> Guardar
                    </button>
                </div>

            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/linea}" method="get" class="d-flex">
                <input type="text" name="buscar" class="form-control me-2" placeholder="Buscar...">
                <button type="submit" class="btn btn-metro-main d-flex gap-1">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a th:href="@{/linea}"
                   class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>
            </form>
        </div>
    </div>

    <!-- TABLA -->
    <div class="table-responsive table-metro-style">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Color</th>
                <th>Longitud (km)</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="l : ${lineas}">
                <td th:text="${l.idLinea}"></td>
                <td th:text="${l.nombreLinea}"></td>
                <td th:text="${l.color}"></td>
                <td th:text="${l.longitudKm}"></td>

                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">

                        <a th:href="@{/linea/editar/{id}(id=${l.idLinea})}"
                           class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                            <i class="bi bi-pencil-square"></i> Editar
                        </a>

                        <a th:href="@{/linea/eliminar/{id}(id=${l.idLinea})}"
                           class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                           onclick="return confirm('¿Eliminar registro?')">
                            <i class="bi bi-trash3-fill"></i> Borrar
                        </a>

                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

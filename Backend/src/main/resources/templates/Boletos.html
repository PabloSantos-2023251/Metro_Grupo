<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>

<body>


<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/Metro.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}"
           class="btn btn-secondary d-inline-flex align-items-center gap-2"
           style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver al Dashboard
        </a>

        <h2 style="color: #091d36; font-weight: 700; margin: 0;"
            th:text="${boletoForm.idBoleto != null} ? 'Modificar Boleto' : 'Gestión de Boletos'">
        </h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div th:if="${errorBoleto}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong th:text="${errorBoleto}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">

            <form th:action="${boletoForm.idBoleto != null} ? @{/boletos/editar/{id}(id=${boletoForm.idBoleto})} : @{/boletos/agregar}"
                  th:object="${boletoForm}" method="post">

                <input type="hidden" th:field="*{idBoleto}" />

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color:#3a4e7a;">Precio</label>
                        <input type="text" class="form-control" th:field="*{precio}"
                               placeholder="Ej: 1.00" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color:#3a4e7a;">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fecha}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color:#3a4e7a;">ID Pasajero</label>
                        <input type="text" class="form-control" name="idPasajero"
                               th:value="${boletoForm.pasajero != null ? boletoForm.pasajero.idPasajero : ''}"
                               placeholder="Ej: 1" required>
                    </div>

                    <div class="col-12 mt-3 text-center">
                        <button type="submit"
                                class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${boletoForm.idBoleto != null} ? 'bi bi-arrow-repeat' : 'bi bi-ticket-fill'"></i>
                            <span th:text="${boletoForm.idBoleto != null} ? 'Guardar Cambios' : 'Agregar Boleto'"></span>
                        </button>

                        <a th:if="${boletoForm.idBoleto != null}"
                           th:href="@{/boletos}"
                           class="btn-cancel-link d-block mt-2">
                            Cancelar edición
                        </a>
                    </div>

                </div>
            </form>

        </div>
    </div>


    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/boletos}" method="get" class="d-flex">

                <input type="number" name="buscarId" class="form-control me-2"
                       placeholder="Buscar por ID Pasajero..." required>

                <button type="submit"
                        class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i> Buscar
                </button>

                <a th:href="@{/boletos}"
                   class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>

            </form>
        </div>
    </div>


    <p th:if="${#lists.isEmpty(boletos) and param.buscarId != null}"
       style="color:red; font-weight:bold;">
        No se encontraron boletos para el pasajero con ID:
        <span th:text="${param.buscarId}"></span>
    </p>


    <div class="table-responsive table-metro-style shadow-sm">

        <table class="table table-hover mb-0">

            <thead>
            <tr>
                <th>ID Boleto</th>
                <th>Precio</th>
                <th>Fecha</th>
                <th>ID Pasajero</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="boleto : ${boletos}">
                <td th:text="${boleto.idBoleto}" class="fw-bold"></td>
                <td th:text="${boleto.precio}"></td>
                <td th:text="${boleto.fecha}"></td>
                <td th:text="${boleto.idPasajero}"></td>

                <td class="text-center">
                    <a th:href="@{/boletos/editar/{id}(id=${boleto.idBoleto})}"
                       class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>

                    <a th:href="@{/boletos/borrar/{id}(id=${boleto.idBoleto})}"
                       class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                       onclick="return confirm('¿Desea borrar este boleto?')">
                        <i class="bi bi-trash3-fill"></i> Borrar
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(boletos)}">
                <td colspan="5" class="text-center py-4 text-muted">
                    No se encontraron resultados.
                </td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

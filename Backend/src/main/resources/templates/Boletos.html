<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletos</title>
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>

<body>
<div class="container">
    <a th:href="@{/PaginaPrincipal}">← Volver</a>

    <h2>Gestión de Boletos</h2>
    <hr>

    <div class="card">
        <form th:action="${boletoForm.idBoleto != null} ? @{/boletos/editar/{id}(id=${boletoForm.idBoleto})} : @{/boletos/agregar}"
              th:object="${boletoForm}" method="post">
            <input type="hidden" th:field="*{idBoleto}" />
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Precio</label>
                    <input type="text" class="form-control" th:field="*{precio}" placeholder="Ej: 1.00" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}" placeholder="DD/MM/AAAA" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">ID Pasajero</label>
                    <input type="text" class="form-control" name="idPasajero"
                           th:value="${boletoForm.pasajero != null ? boletoForm.pasajero.idPasajero : ''}"
                           placeholder="Ej: 1" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success"
                            th:text="${boletoForm.idBoleto != null} ? 'Guardar Cambios' : 'Agregar Boleto'">
                    </button>
                </div>
            </div>
        </form>
    </div>
    
    <div class="search-container">
    <form th:action="@{/boletos}" method="get" style="display:flex; gap:10px;">
        <div style="position:relative; flex:1;">
            <input type="number" name="buscarId" class="form-control search-input"
                   placeholder="Filtrar por ID Pasajero..." required>
        </div>
        <button type="submit" class="btn btn-success" style="width:auto;">Buscar</button>
        <a th:href="@{/boletos}" class="btn btn-secondary">Limpiar</a>
    </form>
</div>
 
    <p th:if="${#lists.isEmpty(boletos) and param.buscarId != null}"
   style="color:red; font-weight:bold;">
    No se encontraron boletos para el pasajero con ID: <span th:text="${param.buscarId}"></span>
</p>

    <table class="table">
        <thead>
        <tr>
            <th>ID Boleto</th>
            <th>Precio</th>
            <th>Fecha</th>
            <th>ID Pasajero</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="boleto : ${boletos}">
            <td th:text="${boleto.idBoleto}"></td>
            <td th:text="${boleto.precio}"></td>
            <td th:text="${boleto.fecha}"></td>
            <td th:text="${boleto.idPasajero}"></td>
            <td>
                <a th:href="@{/boletos/editar/{id}(id=${boleto.idBoleto})}" class="btn btn-warning">Editar</a>
                <a th:href="@{/boletos/borrar/{id}(id=${boleto.idBoleto})}" class="btn btn-danger"
                   onclick="return confirm('¿Desea borrar este boleto?')">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>

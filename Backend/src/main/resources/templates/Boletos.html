<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Boletos | Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline><source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4"></video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 th:text="${session.rolUsuario == 'administrador'} ? 'Gestión de Boletos' : 'Mis Tickets'"></h2>
    </div>

    <div class="row mb-4" th:if="${session.rolUsuario == 'administrador'}">
        <div class="col-md-6">
            <form th:action="@{/boletos}" method="get" class="d-flex gap-2">
                <input type="number" name="buscarId" class="form-control" placeholder="Buscar por ID Pasajero...">
                <button type="submit" class="btn btn-metro-main">Buscar</button>
            </form>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(255,255,255,0.4); border-radius: 15px;">
        <div class="card-body">
            <form th:action="@{/boletos/agregar}" method="post" class="row g-3 align-items-end">
                <div class="col-md-8" th:if="${session.rolUsuario == 'administrador'}">
                    <label class="form-label fw-bold">ID del Pasajero</label>
                    <input type="number" name="idPasajero" class="form-control" required>
                </div>
                <div class="col-md-8" th:unless="${session.rolUsuario == 'administrador'}">
                    <h4 class="mb-0">Precio del Boleto: <span class="fw-bold">Q 10.00</span></h4>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-metro-main w-100">Generar Boleto</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID Ticket</th>
                <th>Fecha</th>
                <th>Precio</th>
                <th>Pasajero</th>
                <th th:if="${session.rolUsuario == 'administrador'}" class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${boletos}">
                <td th:text="${b.idBoleto}"></td>
                <td th:text="${b.fecha}"></td>
                <td th:text="'Q' + ${b.precio}"></td>
                <td th:text="${b.pasajero.nombrePasajero}"></td>
                <td th:if="${session.rolUsuario == 'administrador'}" class="text-center">
                    <a th:href="@{/boletos/borrar/{id}(id=${b.idBoleto})}"
                       class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                       onclick="return confirm('¿Eliminar este boleto?')">
                        <i class="bi bi-trash3-fill"></i> Borrar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(boletos)}">
                <td colspan="5" class="text-center py-4 text-muted">No hay boletos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

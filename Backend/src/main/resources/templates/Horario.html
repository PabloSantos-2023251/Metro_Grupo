<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horarios - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline><source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4"></video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;" th:text="${editando} ? 'Modificar Horario' : 'Horarios de Trenes'"></h2>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/horarios/guardar}" th:object="${horarioObj}" method="post">
                <input type="hidden" th:field="*{idHorario}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">ID Tren</label>
                        <input type="number" th:field="*{idTren}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Hora Salida</label>
                        <input type="time" th:field="*{horaSalida}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Hora Llegada</label>
                        <input type="time" th:field="*{horaLlegada}" class="form-control" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #091d36; border: none;">
                            <span th:text="${editando} ? 'Actualizar Horario' : 'Registrar Horario'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Tren</th>
                <th>Salida</th>
                <th>Llegada</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="h : ${horarios}">
                <td th:text="${h.idHorario}"></td>
                <td th:text="'Unidad ' + ${h.idTren}"></td>
                <td th:text="${h.horaSalida}"></td>
                <td th:text="${h.horaLlegada}"></td>
                <td class="text-center">
                    <a th:href="@{/horarios/editar/{id}(id=${h.idHorario})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/horarios/eliminar/{id}(id=${h.idHorario})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

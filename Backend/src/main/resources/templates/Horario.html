<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Horarios - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>
<div class="container mt-4">
    <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary mb-3">← Volver al Dashboard</a>

    <h2 th:text="${editando} ? 'Modificar Horario' : 'Horarios de Trenes'"></h2>
    <hr>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/horarios/guardar}" th:object="${horarioObj}" method="post">
                <input type="hidden" th:field="*{idHorario}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">ID Tren</label>
                        <input type="number" th:field="*{idTren}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Hora Salida</label>
                        <input type="time" th:field="*{horaSalida}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Hora Llegada</label>
                        <input type="time" th:field="*{horaLlegada}" class="form-control" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary" th:text="${editando} ? 'Actualizar' : 'Registrar'"></button>
                        <a th:if="${editando}" th:href="@{/horarios}" class="btn btn-link">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/horarios}" method="get" class="d-flex">
                <input type="number" name="buscarTren" class="form-control me-2" placeholder="Buscar por ID de Tren..." required>
                <button type="submit" class="btn btn-outline-primary">Buscar</button>
                <a th:href="@{/horarios}" class="btn btn-outline-secondary ms-2">Limpiar</a>
            </form>
        </div>
    </div>

    <table class="table table-striped border">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tren</th>
            <th>Salida</th>
            <th>Llegada</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${horarios}">
            <td th:text="${h.idHorario}"></td>
            <td th:text="'Unidad ' + ${h.idTren}"></td>
            <td th:text="${h.horaSalida}"></td>
            <td th:text="${h.horaLlegada}"></td>
            <td class="text-center">
                <a th:href="@{/horarios/editar/{id}(id=${h.idHorario})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/horarios/eliminar/{id}(id=${h.idHorario})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar horario?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(horarios)}">
            <td colspan="5" class="text-center py-3 text-muted">No se encontraron resultados para ese tren.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horarios - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;" th:text="${editando} ? 'Modificar Horario' : 'Horarios de Trenes'"></h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="container-fluid px-0">
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/horarios/guardar}" th:object="${horarioObj}" method="post">
                <input type="hidden" th:field="*{idHorario}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">ID Tren</label>
                        <input type="number" th:field="*{idTren}" class="form-control" placeholder="Ej: 1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Hora Salida</label>
                        <input type="time" th:field="*{horaSalida}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Hora Llegada</label>
                        <input type="time" th:field="*{horaLlegada}" class="form-control" required>
                    </div>
                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${editando} ? 'bi bi-arrow-repeat' : 'bi bi-clock-fill'"></i>
                            <span th:text="${editando} ? 'Actualizar Horario' : 'Registrar Horario'"></span>
                        </button>
                        <a th:if="${editando}" th:href="@{/horarios}" class="btn-cancel-link d-block mt-2">Cancelar edición</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/horarios}" method="get" class="d-flex">
                <input type="number" name="buscarTren" class="form-control me-2" placeholder="Buscar por ID de Tren...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a th:href="@{/horarios}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tren</th>
                <th>Salida</th>
                <th>Llegada</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="h : ${horarios}">
                <td th:text="${h.idHorario}" class="fw-bold"></td>
                <td th:text="'Unidad ' + ${h.idTren}"></td>
                <td th:text="${h.horaSalida}"></td>
                <td th:text="${h.horaLlegada}"></td>
                <td class="text-center">
                    <a th:href="@{/horarios/editar/{id}(id=${h.idHorario})}" class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>
                    <a th:href="@{/horarios/eliminar/{id}(id=${h.idHorario})}"
                       class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1" onclick="return confirm('¿Eliminar horario?')">
                        <i class="bi bi-trash3-fill"></i> Eliminar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(horarios)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontraron resultados para ese tren.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

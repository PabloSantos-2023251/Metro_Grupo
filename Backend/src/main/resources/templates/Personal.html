<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0;">Gestión de Personal</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/api/personal/guardar}" th:object="${personalObj}" method="post">
                <input type="hidden" th:field="*{id_personal}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Carlos Garcia" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Correo Electrónico</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="carlos@metro.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Contraseña</label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Cargo</label>
                        <select th:field="*{cargo}" class="form-select" required>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                            <option value="Tecnico">Técnico</option>
                            <option value="Seguridad">Seguridad</option>
                            <option value="Atencion Cliente">Atencion Cliente</option>
                            <option value="Taquillera">Taquillera</option>
                            <option value="Administrativo">Administrativo</option>
                            <option value="Limpieza">Limpieza</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Rol Sistema</label>
                        <select th:field="*{rol}" class="form-select" required>
                            <option value="administrador">Administrador</option>
                            <option value="empleado">Empleado</option>
                        </select>
                    </div>

                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2">
                            <i class="bi bi-floppy-fill"></i>
                            <span th:text="${editando} ? 'Actualizar Personal' : 'Guardar Personal'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/api/personal}" method="get" class="d-flex">
                <input type="text" name="buscar" class="form-control me-2" placeholder="Buscar por nombre o email...">
                <button type="submit" class="btn btn-metro-main d-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/api/personal}" class="btn btn-outline-secondary ms-2 d-flex align-items-center">
                    <i class="bi bi-eraser"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Cargo</th>
                <th>Rol</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${personalList}">
                <td th:text="${p.id_personal}" class="fw-bold"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.email}"></td>
                <td><span class="badge bg-secondary" th:text="${p.cargo}"></span></td>
                <td th:text="${p.rol}"></td>
                <td class="text-center">
                    <a th:href="@{/api/personal/editar/{id}(id=${p.id_personal})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/api/personal/eliminar/{id}(id=${p.id_personal})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Borrar usuario?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Trenes - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0; color: #091d36; font-weight: 700;">Gestión de Trenes</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <strong th:text="${mensajeExito}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/trenes/guardar}" th:object="${tren}" method="post">
                <input type="hidden" th:field="*{idTren}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Modelo</label>
                        <input type="text" class="form-control" th:field="*{modelo}" placeholder="Ej: X200" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Capacidad</label>
                        <input type="number" class="form-control" th:field="*{capacidadPasajeros}" placeholder="120" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Estado</label>
                        <select class="form-control" th:field="*{estado}" required>
                            <option value="Activo">Activo</option>
                            <option value="Mantenimiento">En Mantenimiento</option>
                            <option value="Fuera de Servicio">Fuera de Servicio</option>
                        </select>
                    </div>

                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-primary w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2" style="background-color: #091d36; border: none;">
                            <i th:class="${tren.idTren != null} ? 'bi bi-arrow-repeat' : 'bi bi-floppy-fill'"></i>
                            <span th:text="${tren.idTren != null} ? 'Actualizar Tren' : 'Guardar Tren'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/trenes/}" method="get" class="d-flex">
                <input type="number" name="buscarId" class="form-control me-2" placeholder="Buscar por ID...">
                <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-1" style="background-color: #091d36; border: none;">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a th:href="@{/trenes/}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Modelo</th>
                <th>Capacidad</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${trenes}">
                <td th:text="${t.idTren}" class="fw-bold"></td>
                <td th:text="${t.modelo}"></td>
                <td th:text="${t.capacidadPasajeros}"></td>
                <td>
                    <span th:text="${t.estado}"
                          th:classappend="${t.estado == 'Activo'} ? 'badge bg-success' : 'badge bg-warning text-dark'">
                    </span>
                </td>
                <td class="text-center">
                    <a th:href="@{/trenes/editar/{id}(id=${t.idTren})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>
                    <a th:href="@{/trenes/eliminar/{id}(id=${t.idTren})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Seguro?')">
                        <i class="bi bi-trash3-fill"></i> Borrar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

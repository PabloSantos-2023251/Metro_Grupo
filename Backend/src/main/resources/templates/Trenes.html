<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Trenes - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0; color: #091d36; font-weight: 700;">Gestión de Trenes</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="container-fluid px-0">
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body p-4">
            <form th:action="@{/trenes/guardar}" th:object="${tren}" method="post">
                <input type="hidden" th:field="*{idTren}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Modelo de Unidad</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-train-front text-primary"></i></span>
                            <input type="text" class="form-control" th:field="*{modelo}" placeholder="Ej: X200" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Capacidad Máxima</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-people-fill text-primary"></i></span>
                            <input type="number" class="form-control" th:field="*{capacidadPasajeros}" placeholder="120" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Estado Operativo</label>
                        <select class="form-select" th:field="*{estado}" required>
                            <option value="Activo">🟢 Activo</option>
                            <option value="Mantenimiento">🟡 En Mantenimiento</option>
                            <option value="Fuera de Servicio">🔴 Fuera de Servicio</option>
                        </select>
                    </div>

                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${tren.idTren != null} ? 'bi bi-arrow-repeat' : 'bi bi-floppy-fill'"></i>
                            <span th:text="${tren.idTren != null} ? 'Actualizar Tren' : 'Guardar Unidad'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/trenes/}" method="get" class="d-flex">
                <input type="number" name="buscarId" class="form-control me-2 shadow-sm" placeholder="Buscar por ID Tren...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/trenes/}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center" title="Limpiar">
                    <i class="bi bi-eraser-fill"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Modelo</th>
                <th>Capacidad</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${trenes}">
                <td th:text="${t.idTren}" class="fw-bold"></td>
                <td th:text="${t.modelo}"></td>
                <td>
                    <span class="badge bg-light text-dark border"><i class="bi bi-person-fill me-1"></i> <span th:text="${t.capacidadPasajeros}"></span></span>
                </td>
                <td>
                    <span th:text="${t.estado}"
                          class="badge px-3 py-2"
                          th:classappend="${t.estado == 'Activo'} ? 'bg-success-subtle text-success border border-success' :
                                         (${t.estado == 'Mantenimiento'} ? 'bg-warning-subtle text-warning-emphasis border border-warning' : 'bg-danger-subtle text-danger border border-danger')">
                    </span>
                </td>
                <td class="text-center">
                    <a th:href="@{/trenes/editar/{id}(id=${t.idTren})}" class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/trenes/eliminar/{id}(id=${t.idTren})}"
                       class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                       onclick="return confirm('¿Seguro que deseas eliminar esta unidad?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(trenes)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontraron unidades registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

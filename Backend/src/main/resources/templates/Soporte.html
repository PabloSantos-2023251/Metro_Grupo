<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte | InnovaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2.5rem;
        }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="container mt-5">
    <div class="glass-card shadow-lg mx-auto" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Centro de Soporte</h2>
            <a th:href="@{/PaginaPrincipal}" class="btn btn-dark btn-sm rounded-pill px-3">Volver</a>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success border-0 rounded-4" th:text="${mensajeExito}"></div>
        <div th:if="${mensajeError}" class="alert alert-danger border-0 rounded-4" th:text="${mensajeError}"></div>

        <form th:action="@{/soporte/enviar}" th:object="${ticketObj}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" th:field="*{nombreCompleto}" class="form-control" placeholder="Tu nombre" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Tipo de consulta</label>
                    <select th:field="*{tipoConsulta}" class="form-select" required>
                        <option value="soporte">Problema técnico</option>
                        <option value="consulta">Consulta general</option>
                        <option value="sugerencia">Sugerencia</option>
                    </select>
                </div>
                <div class="col-12 mb-4">
                    <label class="form-label">Mensaje</label>
                    <textarea th:field="*{mensaje}" class="form-control" rows="4" placeholder="Describe tu situación..." required></textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-4 shadow-sm" style="background: #4f46e5; border: none;">
                        Enviar Solicitud
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>

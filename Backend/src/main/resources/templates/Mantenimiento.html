<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mantenimiento - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>
<div class="container mt-4">
    <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary mb-3">← Volver al Dashboard</a>

    <h2 th:text="${editando} ? 'Editar Registro de Mantenimiento' : 'Gestión de Mantenimiento de Trenes'"></h2>
    <hr>

    <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
        <strong th:text="${mensajeError}"></strong>
    </div>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form th:action="@{/mantenimientos/guardar}" th:object="${mantenimientoObj}" method="post">
                <input type="hidden" th:field="*{idMantenimiento}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">ID del Tren</label>
                        <input type="number" th:field="*{idTren}" class="form-control" placeholder="Ej: 101" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Fecha</label>
                        <input type="date" th:field="*{fecha}" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Descripción del Trabajo</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="2" placeholder="Describa el mantenimiento realizado..." required></textarea>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success"
                                th:text="${editando} ? 'Actualizar Registro' : 'Guardar Registro'"></button>
                        <a th:if="${editando}" th:href="@{/mantenimientos}" class="btn btn-link">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped border">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tren</th>
                <th>Fecha</th>
                <th>Descripción</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${mantenimientos}">
                <td th:text="${m.idMantenimiento}"></td>
                <td th:text="'Tren #' + ${m.idTren}"></td>
                <td th:text="${m.fecha}"></td>
                <td th:text="${m.descripcion}"></td>
                <td class="text-center">
                    <a th:href="@{/mantenimientos/editar/{id}(id=${m.idMantenimiento})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/mantenimientos/eliminar/{id}(id=${m.idMantenimiento})}"
                       class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este registro?')">Borrar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(mantenimientos)}">
                <td colspan="5" class="text-center py-4 text-muted">No hay mantenimientos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

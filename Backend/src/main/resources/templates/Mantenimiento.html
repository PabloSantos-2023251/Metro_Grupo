<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mantenimiento - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/Metro.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver al Dashboard
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;">Mantenimiento de Trenes</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/mantenimientos/guardar}" th:object="${mantenimientoObj}" method="post">
                <input type="hidden" th:field="*{idMantenimiento}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">ID del Tren</label>
                        <input type="number" th:field="*{idTren}" class="form-control" placeholder="Ej: 1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Fecha</label>
                        <input type="date" th:field="*{fecha}" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Descripción del Trabajo</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="2" placeholder="Describa la actividad..." required></textarea>
                    </div>
                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${editando} ? 'bi bi-arrow-repeat' : 'bi bi-floppy-fill'"></i>
                            <span th:text="${editando} ? 'Actualizar Registro' : 'Guardar Registro'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/mantenimientos}" method="get" class="d-flex">
                <input type="number" name="buscarTren" class="form-control me-2" placeholder="Filtrar por Tren...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a th:href="@{/mantenimientos}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tren</th>
                <th>Fecha</th>
                <th>Descripción</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${mantenimientos}">
                <td th:text="${m.idMantenimiento}" class="fw-bold"></td>
                <td th:text="'Tren #' + ${m.idTren}"></td>
                <td th:text="${m.fecha}"></td>
                <td th:text="${m.descripcion}"></td>
                <td class="text-center">
                    <a th:href="@{/mantenimientos/editar/{id}(id=${m.idMantenimiento})}" class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>
                    <a th:href="@{/mantenimientos/eliminar/{id}(id=${m.idMantenimiento})}"
                       class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                       onclick="return confirm('¿Eliminar registro?')">
                        <i class="bi bi-trash3-fill"></i> Borrar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(mantenimientos)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontraron registros.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

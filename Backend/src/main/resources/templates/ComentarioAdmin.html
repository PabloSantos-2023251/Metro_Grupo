<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tickets de Soporte | Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
    <style>
        /* Estilos específicos para la tabla de tickets */
        .select-status-metro {
            background: rgba(255, 255, 255, 0.9);
            color: #091d36;
            border: 1px solid #c2d2e9;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .badge-metro {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
        }
        .badge-pendiente { background-color: #ffc107; color: #000; }
        .badge-en_proceso { background-color: #17a2b8; color: #fff; }
        .badge-resuelto { background-color: #28a745; color: #fff; }
    </style>
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;">Bandeja de Tickets</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="container-fluid px-0">
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Asunto</th>
                <th>Mensaje</th>
                <th>Estado Actual</th>
                <th>Acción (Actualizar)</th>
                <th class="text-center">Eliminar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${comentarios}">
                <td th:text="${c.id}" class="fw-bold"></td>
                <td>
                    <div style="font-weight: 600; color: #091d36;" th:text="${c.nombreCompleto}"></div>
                    <div style="font-size: 0.8rem; color: #555;" th:text="${c.email}"></div>
                </td>
                <td style="text-transform: capitalize;" th:text="${c.tipoConsulta}"></td>
                <td>
                    <span th:text="${c.mensaje}" style="max-width: 200px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" th:title="${c.mensaje}"></span>
                </td>
                <td>
                    <span th:class="'badge-metro badge-' + ${c.estado}"
                          th:text="${#strings.replace(c.estado, '_', ' ')}"></span>
                </td>
                <td>
                    <form th:action="@{/ComentarioAdmin/actualizar-estado}" method="post" class="d-flex align-items-center">
                        <input type="hidden" name="id" th:value="${c.id}">
                        <select name="nuevoEstado" class="select-status-metro" onchange="this.form.submit()">
                            <option value="pendiente" th:selected="${c.estado.name() == 'pendiente'}">Pendiente</option>
                            <option value="en_proceso" th:selected="${c.estado.name() == 'en_proceso'}">En Proceso</option>
                            <option value="resuelto" th:selected="${c.estado.name() == 'resuelto'}">Resuelto</option>
                        </select>
                    </form>
                </td>
                <td class="text-center">
                    <a th:href="@{/ComentarioAdmin/eliminar/{id}(id=${c.id})}"
                       class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                       onclick="return confirm('¿Deseas eliminar este ticket permanentemente?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(comentarios)}">
                <td colspan="7" class="text-center py-4 text-muted">No hay tickets pendientes en el sistema.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

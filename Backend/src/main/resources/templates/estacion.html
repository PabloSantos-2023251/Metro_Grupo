<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estaciones - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline><source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4"></video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0; color: #091d36; font-weight: 700;">Gestión de Estaciones</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/estaciones/guardar}" th:object="${estacion}" method="post">
                <input type="hidden" th:field="*{idEstacion}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Nombre Estación</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Zona</label>
                        <input type="text" th:field="*{zona}" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Línea</label>
                        <select class="form-control" th:field="*{idLinea}" required>
                            <option value="1">Línea 1</option>
                            <option value="2">Línea 2</option>
                            <option value="3">Línea 3</option>
                        </select>
                    </div>
                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #091d36; border: none;">
                            <i class="bi bi-floppy-fill"></i> Guardar Estación
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/estaciones/}" method="get" class="d-flex">
                <input type="text" name="buscar" class="form-control me-2" placeholder="Buscar...">
                <button type="submit" class="btn btn-primary" style="background-color: #091d36; border: none;">Buscar</button>
                <a th:href="@{/estaciones/}" class="btn btn-outline-secondary ms-2">Limpiar</a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Zona</th>
                <th>Línea</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${estaciones}">
                <td th:text="${e.idEstacion}" class="fw-bold"></td>
                <td th:text="${e.nombre}"></td>
                <td th:text="${e.zona}"></td>
                <td th:text="'Línea ' + ${e.idLinea}"></td>
                <td class="text-center">
                    <a th:href="@{/estaciones/editar/{id}(id=${e.idEstacion})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/estaciones/eliminar/{id}(id=${e.idEstacion})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Metro Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/LoginStyle.css}">
</head>
<body>

<div class="login-wrapper">

    <div class="scene-panel">
        <div class="station-header">
            <div class="line-badge">
                <img th:src="@{/imagenes/LogoOscuro.png}" alt="Logo">
            </div>
            <div>
                <p style="font-family: var(--font-head); font-size: 0.68rem; letter-spacing: 3px; color: var(--blue-lt); margin: 0;">GESTION DEL</p>
                <span class="station-name">METRO</span>
            </div>
        </div>

        <div class="platform-scene">
            <div class="train-car train-navy" id="trainNavy">
                <div class="train-front">
                    <div class="cab-window">
                        <div class="eye-socket" id="eyeL1"><div class="pupil" id="pupilL1"></div></div>
                        <div class="eye-socket" id="eyeR1"><div class="pupil" id="pupilR1"></div></div>
                    </div>
                    <div class="headlight hl-left"></div>
                    <div class="headlight hl-right"></div>
                </div>
                <div class="train-body">
                    <div class="body-window"></div><div class="body-window"></div><div class="body-window"></div>
                </div>
            </div>

            <div class="train-car train-teal" id="trainTeal">
                <div class="train-front">
                    <div class="cab-window">
                        <div class="eye-socket" id="eyeL2"><div class="pupil" id="pupilL2"></div></div>
                        <div class="eye-socket" id="eyeR2"><div class="pupil" id="pupilR2"></div></div>
                    </div>
                    <div class="headlight hl-left"></div>
                    <div class="headlight hl-right"></div>
                </div>
                <div class="train-body small-body">
                    <div class="body-window"></div><div class="body-window"></div>
                </div>
            </div>

            <div class="platform-floor"></div>
            <div class="rails">
                <div class="rail rail-left"></div><div class="rail rail-right"></div>
                <div class="sleeper"></div><div class="sleeper"></div><div class="sleeper"></div><div class="sleeper"></div><div class="sleeper"></div>
            </div>
        </div>

        <div class="scene-footer">Sistema de Gestión de Transporte Subterráneo</div>
    </div>

    <div class="form-panel">
        <div class="form-inner">
            <div class="brand-mark">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>
                    </svg>
                </div>
                <span class="brand-text">METRO<span>SUBTERRANEO</span></span>
            </div>

            <h2 class="form-title">Acceso Operadores</h2>
            <p class="form-subtitle">Ingresa tus credenciales para continuar</p>

            <form th:action="@{/login}" method="post" class="login-form">
                <div class="field-group">
                    <label class="field-label">Correo Electrónico</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M1 6l7 4 7-4" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <input type="email" name="email" class="field-input" placeholder="usuario@metro.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">Contraseña</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <input type="password" name="password" id="password" class="field-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-pw" id="togglePw">
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">INGRESAR AL SISTEMA</button>
            </form>

            <div class="form-note-box">
                <svg class="note-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                <p class="note-text">
                    Acceso restringido a personal autorizado del Metro.
                    <br>Se registrará la dirección IP de cada intento.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const pupils = [
        { l: document.getElementById('pupilL1'), r: document.getElementById('pupilR1'), le: document.getElementById('eyeL1'),  re: document.getElementById('eyeR1'), max: 5 },
        { l: document.getElementById('pupilL2'), r: document.getElementById('pupilR2'), le: document.getElementById('eyeL2'),  re: document.getElementById('eyeR2'), max: 4 },
    ];

    let passwordVisible = false;
    let passwordHasValue = false;
    const passwordInput = document.getElementById('password');
    const trainNavy = document.getElementById('trainNavy');
    const trainTeal = document.getElementById('trainTeal');

    document.addEventListener('mousemove', (e) => {
        if (passwordHasValue && !passwordVisible) return;
        pupils.forEach(p => {
            const move = (el, eye, mX, mY, max) => {
                const r = eye.getBoundingClientRect();
                const dx = mX - (r.left + r.width/2), dy = mY - (r.top + r.height/2);
                const d = Math.min(Math.hypot(dx, dy), max), a = Math.atan2(dy, dx);
                el.style.transform = `translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
            };
            move(p.l, p.le, e.clientX, e.clientY, p.max);
            move(p.r, p.re, e.clientX, e.clientY, p.max);
        });
    });

    passwordInput.addEventListener('input', () => {
        passwordHasValue = passwordInput.value.length > 0;
        if (passwordHasValue && !passwordVisible) {
            document.querySelectorAll('.eye-socket').forEach(e => e.classList.add('blink'));
            trainNavy.classList.add('shy'); trainTeal.classList.add('shy');
        } else {
            document.querySelectorAll('.eye-socket').forEach(e => e.classList.remove('blink'));
            trainNavy.classList.remove('shy'); trainTeal.classList.remove('shy');
        }
    });

    document.getElementById('togglePw').addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        const icon = document.getElementById('eyeIcon');
        icon.innerHTML = passwordVisible
            ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
            : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        passwordInput.dispatchEvent(new Event('input'));
    });

    function autoBlink() {
        if (!trainNavy.classList.contains('shy')) {
            document.querySelectorAll('.eye-socket').forEach(e => {
                e.classList.add('blink-anim');
                setTimeout(() => e.classList.remove('blink-anim'), 150);
            });
        }
        setTimeout(autoBlink, 3000 + Math.random() * 4000);
    }

    window.addEventListener('load', () => {
        trainNavy.classList.add('arrive');
        setTimeout(() => trainTeal.classList.add('arrive'), 300);
        autoBlink();
    });
</script>
</body>
</html>

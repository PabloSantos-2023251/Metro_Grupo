<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Impacto en Tráfico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container mt-4">
    <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary mb-3">Volver</a>

    <h2 th:text="${editando} ? 'Editar Impacto en Tráfico' : 'Gestión de Impacto en Tráfico'"></h2>
    <hr>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong th:text="${mensajeError}"></strong>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/api/impacto-trafico/guardar}" th:object="${impactoObj}" method="post">
                <input type="hidden" th:field="*{id_impacto}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Zona</label>
                        <input type="text" th:field="*{zona}" class="form-control" placeholder="Ej: Zona 2" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Reducción (%)</label>
                        <input type="number" step="0.01" th:field="*{reduccionTraficoPorcentaje}" class="form-control" placeholder="Ej: 20" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success"
                                th:text="${editando} ? 'Actualizar Impacto' : 'Guardar Impacto'"></button>
                        <a th:if="${editando}" th:href="@{/api/impacto-trafico}" class="btn btn-link text-decoration-none">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <form th:action="@{/api/impacto-trafico}" method="get" class="d-flex gap-2">
                <input type="text" name="buscar" th:value="${param.buscar}" class="form-control" placeholder="🔍 Buscar por zona o ID...">
                <button type="submit" class="btn btn-primary">Filtrar</button>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover border">
            <thead class="table-light">
            <tr>
                <th>ID Impacto</th>
                <th>Zona</th>
                <th>Reducción</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${impactos}">
                <td th:text="${i.id_impacto}"></td>
                <td th:text="${i.zona}"></td>
                <td th:text="${i.reduccionTraficoPorcentaje + '%'}"></td>
                <td class="text-center">
                    <a th:href="@{/api/impacto-trafico/editar/{id}(id=${i.id_impacto})}"
                       class="btn btn-sm btn-warning">Editar</a>

                    <a th:href="@{/api/impacto-trafico/eliminar/{id}(id=${i.id_impacto})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Está seguro de eliminar este registro?')">Borrar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(impactos)}">
                <td colspan="4" class="text-center py-4 text-muted">No se encontraron registros.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

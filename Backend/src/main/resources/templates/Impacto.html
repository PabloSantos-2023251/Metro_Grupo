<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Impacto en Tráfico - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/Metro.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver al Dashboard
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;"
            th:text="${editando} ? 'Modificar Impacto' : 'Impacto en Tráfico'"></h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong th:text="${mensajeError}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body p-4">
            <form th:action="@{/api/impacto-trafico/guardar}" th:object="${impactoObj}" method="post">
                <input type="hidden" th:field="*{id_impacto}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Zona de Influencia</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-geo-alt-fill text-muted"></i></span>
                            <input type="text" th:field="*{zona}" class="form-control border-start-0" placeholder="Ej: Zona Norte" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Reducción de Tráfico (%)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-percent text-muted"></i></span>
                            <input type="number" step="0.01" th:field="*{reduccionTraficoPorcentaje}" class="form-control border-start-0" placeholder="Ej: 15.50" required>
                        </div>
                    </div>

                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${editando} ? 'bi bi-pencil-square' : 'bi bi-plus-circle-fill'"></i>
                            <span th:text="${editando} ? 'Actualizar Registro' : 'Registrar Impacto'"></span>
                        </button>
                        <a th:if="${editando}" th:href="@{/api/impacto-trafico}" class="btn btn-link text-decoration-none mt-2 d-block" style="color: #3a4e7a;">Cancelar edición</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-5">
            <form th:action="@{/api/impacto-trafico}" method="get" class="d-flex shadow-sm rounded">
                <input type="text" name="buscar" th:value="${param.buscar}" class="form-control me-2" placeholder="Buscar zona o ID...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Zona</th>
                <th>Reducción (%)</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${impactos}">
                <td th:text="${i.id_impacto}" class="fw-bold text-muted"></td>
                <td th:text="${i.zona}"></td>
                <td>
                        <span class="badge bg-success" style="font-size: 0.9rem;">
                            <i class="bi bi-arrow-down-short"></i>
                            <span th:text="${i.reduccionTraficoPorcentaje + '%'}"></span>
                        </span>
                </td>
                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a th:href="@{/api/impacto-trafico/editar/{id}(id=${i.id_impacto})}"
                           class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/api/impacto-trafico/eliminar/{id}(id=${i.id_impacto})}"
                           class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                           onclick="return confirm('¿Seguro que desea eliminar este registro?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(impactos)}">
                <td colspan="4" class="text-center py-5 text-muted">
                    <i class="bi bi-cloud-slash d-block fs-1 mb-2"></i>
                    No se encontraron registros de impacto.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

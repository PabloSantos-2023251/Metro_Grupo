<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impacto en Tráfico - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline><source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4"></video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal/}" class="btn btn-secondary" style="background-color: #3a4e7a; border: none;">Volver</a>
        <h2 th:text="${editando} ? 'Editar Impacto' : 'Análisis Vial'"></h2>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/api/impacto-trafico/guardar}" th:object="${impactoObj}" method="post">
                <input type="hidden" th:field="*{id_impacto}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Zona o Área</label>
                        <input type="text" th:field="*{zona}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Reducción (%)</label>
                        <input type="number" step="0.01" th:field="*{reduccionTraficoPorcentaje}" class="form-control" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #091d36; border: none;">Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Zona</th>
                <th>Reducción</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${impactos}">
                <td th:text="${i.id_impacto}"></td>
                <td th:text="${i.zona}"></td>
                <td th:text="${i.reduccionTraficoPorcentaje + '%'}"></td>
                <td class="text-center">
                    <a th:href="@{/api/impacto-trafico/editar/{id}(id=${i.id_impacto})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/api/impacto-trafico/eliminar/{id}(id=${i.id_impacto})}" class="btn btn-sm btn-danger">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

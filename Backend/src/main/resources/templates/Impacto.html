<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <a th:href="@{/home}" class="btn btn-secondary">← Volver</a>

    <h2 th:text="${editando} ? 'Editar Personal' : 'Gestión de Personal'"></h2>
    <hr>

    <div th:if="${mensajeError}" class="alert alert-danger" role="alert" style="margin-bottom: 20px; border-radius: 8px;">
        <strong th:text="${mensajeError}"></strong>
    </div>

    <div class="card">
        <form th:action="@{/api/personal/guardar}" th:object="${personalObj}" method="post">
            <input type="hidden" th:field="*{id_personal}">

            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Pablo Santos" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="ejemplo@metro.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cargo</label>
                    <select th:field="*{cargo}" class="form-control" required>
                        <option value="">Seleccione un cargo...</option>
                        <option value="Gerente">Gerente</option>
                        <option value="Conserje">Conserje</option>
                        <option value="Conductor">Conductor</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success"
                            th:text="${editando} ? 'Actualizar Personal' : 'Guardar Personal'"
                            style="margin-top: 15px;"></button>
                </div>
            </div>

            <div th:if="${editando}" class="text-center" style="margin-top: 10px;">
                <a th:href="@{/api/personal}" style="color: #3a4e7a; font-weight: 600; text-decoration: none;">Cancelar edición</a>
            </div>
        </form>
    </div>

    <div class="row" style="margin-bottom: 25px;">
        <div class="col-md-6">
            <form th:action="@{/api/personal}" method="get" style="display: flex; gap: 10px;">
                <input type="text" name="buscar" th:value="${param.buscar}" class="form-control" placeholder="🔍 Buscar por nombre, email o cargo...">
                <button type="submit" class="btn btn-secondary" style="margin-bottom: 0;">Filtrar</button>
            </form>
        </div>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Cargo</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${personalList}">
            <td th:text="${p.id_personal}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.email}"></td>
            <td th:text="${p.cargo}"></td>
            <td class="text-center">
                <a th:href="@{/api/personal/editar/{id}(id=${p.id_personal})}"
                   class="btn btn-warning">Editar</a>
                <a th:href="@{/api/personal/eliminar/{id}(id=${p.id_personal})}"
                   class="btn btn-danger"
                   onclick="return confirm('¿Está seguro de eliminar este registro?')">Borrar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(personalList)}">
            <td colspan="5" class="text-center" style="padding: 30px; color: #3a4e7a;">No se encontraron registros de personal.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Metro | Registro de Pasajeros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/LoginStyle.css}">
    <style>
        input::-ms-reveal, input::-ms-clear { display: none; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="scene-panel">
        <div class="station-header">
            <div class="line-badge">
                <img th:src="@{/imagenes/LogoOscuro.png}" alt="Logo">
            </div>
            <div>
                <p style="font-family: var(--font-head); font-size: 0.68rem; letter-spacing: 3px; color: var(--blue-lt); margin: 0;">GESTION DEL</p>
                <span class="station-name">METRO</span>
            </div>
        </div>

        <div class="platform-scene">
            <div class="train-car train-navy" id="trainNavy">
                <div class="train-front">
                    <div class="cab-window">
                        <div class="eye-socket" id="eyeL1"><div class="pupil" id="pupilL1"></div></div>
                        <div class="eye-socket" id="eyeR1"><div class="pupil" id="pupilR1"></div></div>
                    </div>
                    <div class="headlight hl-left"></div>
                    <div class="headlight hl-right"></div>
                </div>
                <div class="train-body">
                    <div class="body-window"></div><div class="body-window"></div><div class="body-window"></div>
                </div>
            </div>

            <div class="platform-floor"></div>
            <div class="rails">
                <div class="rail rail-left"></div><div class="rail rail-right"></div>
                <div class="sleeper"></div><div class="sleeper"></div><div class="sleeper"></div><div class="sleeper"></div><div class="sleeper"></div>
            </div>
        </div>

        <div class="scene-footer">Sistema de Gestión de Transporte Subterráneo</div>
    </div>

    <div class="form-panel">
        <div class="form-inner">
            <div class="brand-mark">
                <div class="brand-icon" style="background: #4db6ac;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="17" y1="11" x2="23" y2="11"></line>
                    </svg>
                </div>
                <span class="brand-text">METRO<span style="color: #4db6ac;">PASAJEROS</span></span>
            </div>

            <h2 class="form-title">Crear Cuenta</h2>
            <p class="form-subtitle">Regístrate para gestionar tus viajes</p>

            <form th:action="@{/registro}" th:object="${pasajero}" method="post" class="login-form">
                <div class="field-group">
                    <label class="field-label">Nombre Completo</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" th:field="*{nombre}" class="field-input" placeholder="Ej. Juan Pérez" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">Correo Electrónico</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M1 6l7 4 7-4" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <input type="email" th:field="*{email}" class="field-input" placeholder="tu@correo.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">Contraseña</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <input type="password" th:field="*{password}" id="password" class="field-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-pw" id="togglePw">
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">Tipo de Pasajero</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <select th:field="*{tipo}" class="field-input" style="background: #091d36; color: white; cursor: pointer;">
                            <option value="General">General</option>
                            <option value="Estudiante">Estudiante</option>
                            <option value="Adulto Mayor">Adulto Mayor</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="submit-btn" style="background: #4db6ac; color: white; margin-top: 20px; border: none;">
                    FINALIZAR REGISTRO
                </button>
            </form>

            <div class="register-section" style="margin-top: 1.5rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.2rem;">
                <a th:href="@{/login}" style="color: #64b5f6; text-decoration: none; font-weight: 700; font-size: 0.9rem;">
                    ← VOLVER AL INICIO DE SESIÓN
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const eyeL = document.getElementById('eyeL1');
    const eyeR = document.getElementById('eyeR1');
    const pupilL = document.getElementById('pupilL1');
    const pupilR = document.getElementById('pupilR1');
    const trainNavy = document.getElementById('trainNavy');
    const passwordInput = document.getElementById('password');
    let passwordVisible = false;
    let passwordHasValue = false;

    document.addEventListener('mousemove', (e) => {
        if (passwordHasValue && !passwordVisible) return;
        const move = (el, eye, mX, mY, max) => {
            const r = eye.getBoundingClientRect();
            const dx = mX - (r.left + r.width/2), dy = mY - (r.top + r.height/2);
            const d = Math.min(Math.hypot(dx, dy), max), a = Math.atan2(dy, dx);
            el.style.transform = `translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px))`;
        };
        move(pupilL, eyeL, e.clientX, e.clientY, 5);
        move(pupilR, eyeR, e.clientX, e.clientY, 5);
    });

    passwordInput.addEventListener('input', () => {
        passwordHasValue = passwordInput.value.length > 0;
        if (passwordHasValue && !passwordVisible) {
            [eyeL, eyeR].forEach(e => e.classList.add('blink'));
            trainNavy.classList.add('shy');
        } else {
            [eyeL, eyeR].forEach(e => e.classList.remove('blink'));
            trainNavy.classList.remove('shy');
        }
    });

    document.getElementById('togglePw').addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        const icon = document.getElementById('eyeIcon');
        icon.innerHTML = passwordVisible
        ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        passwordInput.dispatchEvent(new Event('input'));
    });

    function autoBlink() {
        if (!trainNavy.classList.contains('shy')) {
            [eyeL, eyeR].forEach(e => {
                e.classList.add('blink-anim');
                setTimeout(() => e.classList.remove('blink-anim'), 150);
            });
        }
        setTimeout(autoBlink, 3000 + Math.random() * 4000);
    }

    window.addEventListener('load', () => {
        trainNavy.classList.add('arrive');
        autoBlink();
    });
</script>
</body>
</html>

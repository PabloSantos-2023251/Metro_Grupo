<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conductores</title>
    <link rel="stylesheet" href="/Estilos.css">
</head>

<body>

<div class="container">
    <a href="PaginaPrincipal.html" class="btn btn-secondary">← Volver</a>

    <h2>Gestión de Conductores</h2>
    <hr>

    <div class="card">
        <form id="formConductores">
            <div class="row">

                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Licencia</label>
                    <input type="text" class="form-control" placeholder="Ej: B1234567" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Años de Experiencia</label>
                    <input type="number" class="form-control" placeholder="Ej: 5" required>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success">Guardar Conductor</button>
                </div>

            </div>
        </form>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID Conductor</th>
            <th>Nombre</th>
            <th>Licencia</th>
            <th>Años de Experiencia</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>1</td>
            <td>Juan Pérez</td>
            <td>B1234567</td>
            <td>5</td>
            <td>
                <button class="btn btn-warning">Editar</button>
                <button class="btn btn-danger">Borrar</button>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>

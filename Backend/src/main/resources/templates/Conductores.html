<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Conductores - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0; font-weight: 700; color: #091d36;">Gestión de Conductores</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="container-fluid px-0">
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body">
            <form th:action="@{/conductores/guardar}" th:object="${conductor}" method="post">
                <input type="hidden" th:field="*{idConductor}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Número de Licencia</label>
                        <input type="text" th:field="*{licencia}" class="form-control" placeholder="Ej: B-12345" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Experiencia (Años)</label>
                        <input type="number" th:field="*{aniosExperiencia}" class="form-control" placeholder="Ej: 5" required>
                    </div>
                    <div class="col-12 mt-3 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${conductor.idConductor != null} ? 'bi bi-arrow-repeat' : 'bi bi-person-badge-fill'"></i>
                            <span th:text="${conductor.idConductor != null} ? 'Actualizar Conductor' : 'Guardar Conductor'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/conductores}" method="get" class="d-flex">
                <input type="number" name="buscarId" class="form-control me-2" placeholder="Buscar por ID Conductor...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/conductores}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center" title="Limpiar búsqueda">
                    <i class="bi bi-eraser-fill"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Licencia</th>
                <th>Experiencia</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${conductores}">
                <td th:text="${c.idConductor}" class="fw-bold"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.licencia}"></td>
                <td>
                    <span class="badge bg-light text-dark border" th:text="${c.aniosExperiencia} + ' años'"></span>
                </td>
                <td class="text-center">
                    <a th:href="@{/conductores/editar/{id}(id=${c.idConductor})}" class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/conductores/eliminar/{id}(id=${c.idConductor})}" class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1" onclick="return confirm('¿Eliminar conductor?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(conductores)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontraron conductores registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

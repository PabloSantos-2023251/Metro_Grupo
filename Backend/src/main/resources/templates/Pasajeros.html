<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro | Gestión de Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="margin: 0; font-weight: 700; color: #091d36;" th:text="${pasajeroForm.idPasajero != null} ? 'Modificar Pasajero' : 'Gestión de Pasajeros'"></h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="card p-4 mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <form th:action="@{/pasajeros/guardar}" th:object="${pasajeroForm}" method="post">
            <input type="hidden" th:field="*{idPasajero}">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre Completo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" th:field="*{nombrePasajero}" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="color: #3a4e7a;">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="usuario@metro.com" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="color: #3a4e7a;">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" th:required="${pasajeroForm.idPasajero == null}">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="color: #3a4e7a;">Tipo de Pasajero</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-tags"></i></span>
                        <select th:field="*{tipoPasajero}" class="form-select" required>
                            <option value="General">General</option>
                            <option value="Estudiante">Estudiante</option>
                            <option value="Adulto Mayor">Adulto Mayor</option>
                            <option value="Discapacitado">Discapacitado</option>
                        </select>
                    </div>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100 py-3 d-inline-flex justify-content-center align-items-center gap-2" style="background-color: #091d36; border: none;">
                        <i th:class="${pasajeroForm.idPasajero != null} ? 'bi bi-arrow-repeat' : 'bi bi-person-fill-add'"></i>
                        <span th:text="${pasajeroForm.idPasajero != null} ? 'Guardar Cambios' : 'Registrar Pasajero'"></span>
                    </button>
                    <a th:if="${pasajeroForm.idPasajero != null}" th:href="@{/pasajeros}" class="d-block mt-2 text-center text-decoration-none text-muted">
                        Cancelar edición
                    </a>
                </div>
            </div>
        </form>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <form th:action="@{/pasajeros}" method="get" class="d-flex gap-2">
                <input type="number" name="buscarId" class="form-control" placeholder="Buscar por ID..." required>
                <button type="submit" class="btn btn-primary" style="background-color: #091d36; border: none;">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/pasajeros}" class="btn btn-outline-secondary">
                    <i class="bi bi-eraser-fill"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Nombre Completo</th>
                <th>Email</th>
                <th>Tipo</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pasajeros}">
                <td th:text="${p.idPasajero}" class="fw-bold"></td>
                <td th:text="${p.nombrePasajero}"></td>
                <td th:text="${p.email}"></td>
                <td><span class="badge bg-info text-dark" th:text="${p.tipoPasajero}"></span></td>
                <td class="text-center">
                    <a th:href="@{/pasajeros/editar/{id}(id=${p.idPasajero})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/pasajeros/borrar/{id}(id=${p.idPasajero})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

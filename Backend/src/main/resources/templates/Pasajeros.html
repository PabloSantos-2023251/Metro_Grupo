<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro | Gestión de Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>

<body>
<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="container">
    <div class="main-container-glass">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2"
               style="background: #334155; border: none; border-radius: 12px; padding: 10px 20px;">
                <i class="bi bi-arrow-left-circle"></i> Dashboard
            </a>
            <h2 th:text="${pasajeroForm.idPasajero != null} ? 'Modificar Pasajero' : 'Gestión de Pasajeros'" style="margin: 0; color: white;"></h2>
        </div>

        <div th:if="${nuevoId}" class="alert mb-4 animate__animated animate__fadeIn"
             style="background: var(--accent-grad); color: white; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);">
            <div class="d-flex align-items-center p-2">
                <i class="bi bi-person-check-fill fs-2 me-3"></i>
                <div>
                    <h5 class="mb-0 fw-bold">¡Registro Exitoso!</h5>
                    <p class="mb-0">Se ha generado el <strong>ID: <span th:text="${nuevoId}"></span></strong> para el pasajero.</p>
                </div>
            </div>
        </div>

        <hr style="border-color: rgba(255,255,255,0.1); margin-bottom: 30px;">

        <div class="card p-4 mb-5" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px);">
            <form th:action="${pasajeroForm.idPasajero != null} ? @{/pasajeros/editar/{id}(id=${pasajeroForm.idPasajero})} : @{/pasajeros/agregar}"
                  th:object="${pasajeroForm}" method="post">
                <input type="hidden" th:field="*{idPasajero}" />

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-white">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{nombrePasajero}" placeholder="Ej: Juan Pérez" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-white">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-white"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control bg-dark text-white border-secondary" th:field="*{email}" placeholder="usuario@metro.com" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-white">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-dark text-white border-secondary" th:field="*{password}" placeholder="••••••••"
                                   th:required="${pasajeroForm.idPasajero == null}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold text-white">Tipo de Pasajero</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-white"><i class="bi bi-tags"></i></span>
                            <select class="form-select bg-dark text-white border-secondary" th:field="*{tipoPasajero}" required>
                                <option value="">-- Seleccionar --</option>
                                <option value="General">General</option>
                                <option value="Estudiante">Estudiante</option>
                                <option value="Adulto Mayor">Adulto Mayor</option>
                                <option value="Discapacitado">Discapacitado</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold d-inline-flex justify-content-center align-items-center gap-2"
                                style="border-radius: 12px; background: linear-gradient(45deg, #3b82f6, #2563eb);">
                            <i th:class="${pasajeroForm.idPasajero != null} ? 'bi bi-arrow-repeat' : 'bi bi-person-fill-add'"></i>
                            <span th:text="${pasajeroForm.idPasajero != null} ? 'Guardar Cambios' : 'Registrar Pasajero'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive mt-4">
            <table class="table table-dark table-hover" style="background: rgba(0,0,0,0.2); border-radius: 15px; overflow: hidden;">
                <thead class="table-light">
                <tr>
                    <th>ID & Tipo</th>
                    <th>Nombre Completo</th>
                    <th>Correo Electrónico</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pasajero : ${pasajeros}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-secondary" th:text="${'ID: ' + pasajero.idPasajero}"></span>
                            <span class="badge bg-info text-dark" th:text="${pasajero.tipo}"></span>
                        </div>
                    </td>
                    <td th:text="${pasajero.nombre}" class="fw-bold"></td>
                    <td th:text="${pasajero.email}"></td>
                    <td class="text-center">
                        <div class="btn-group">
                            <a th:href="@{/pasajeros/editar/{id}(id=${pasajero.idPasajero})}" class="btn btn-sm btn-outline-warning">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/pasajeros/borrar/{id}(id=${pasajero.idPasajero})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar permanentemente?')">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

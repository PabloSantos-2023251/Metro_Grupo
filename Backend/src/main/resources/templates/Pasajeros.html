<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasajeros</title>
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>

<body>
<div class="container">
    <a th:href="@{/PaginaPrincipal}">← Volver</a>

    <h2>Gestión de Pasajeros</h2>
    <hr>

    <div class="card">
        <form th:action="${pasajeroForm.idPasajero != null} ? @{/pasajeros/editar/{id}(id=${pasajeroForm.idPasajero})} : @{/pasajeros/agregar}"
              th:object="${pasajeroForm}" method="post">
        <input type="hidden" th:field="*{idPasajero}" />
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombrePasajero}" placeholder="Ej: Juan" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tipo</label>
                    <input type="text" class="form-control" th:field="*{tipoPasajero}" placeholder="Ej: Adulto" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success"
                            th:text="${pasajeroForm.idPasajero != null} ? 'Guardar Cambios' : 'Agregar Pasajero'">
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="search-container">
    <form th:action="@{/pasajeros}" method="get" style="display:flex; gap:10px;">
        <div style="position:relative; flex:1;">
            <input type="number" name="buscarId" class="form-control search-input"
                   placeholder="Filtrar por ID Pasajero..." required>
        </div>
        <button type="submit" class="btn btn-success" style="width:auto;">Buscar</button>
        <a th:href="@{/pasajeros}" class="btn btn-secondary">Limpiar</a>
    </form>
    </div>

    <p th:if="${mensajeVacio}" th:text="${mensajeVacio}" 
   style="color:red; font-weight:bold;"></p> 

    <table class="table">
        <thead>
        <tr>
            <th>ID Pasajero</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pasajero : ${pasajeros}">
            <td th:text="${pasajero.idPasajero}"></td>
            <td th:text="${pasajero.nombre}"></td>
            <td th:text="${pasajero.tipo}"></td>
            <td>
                <a th:href="@{/pasajeros/editar/{id}(id=${pasajero.idPasajero})}" class="btn btn-warning">Editar</a>
                <a th:href="@{/pasajeros/borrar/{id}(id=${pasajero.idPasajero})}" class="btn btn-danger"
                   onclick="return confirm('¿Desea borrar este pasajero?')">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>

</html>

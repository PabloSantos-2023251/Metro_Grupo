<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro | Gestión de Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>

<body>
<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/PaginaPrincipal/}" class="btn btn-secondary" style="background: #334155; border: none; border-radius: 12px;">Dashboard</a>
        <h2 th:text="${pasajeroForm.idPasajero != null} ? 'Modificar Pasajero' : 'Gestión de Pasajeros'"></h2>
    </div>

    <form th:action="@{/pasajeros/guardar}" th:object="${pasajeroForm}" method="post" class="card p-4 mb-5" style="background: rgba(255,255,255,0.03); border-radius: 20px;">
        <input type="hidden" th:field="*{idPasajero}">
        <div class="row g-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">Nombre Completo</label>
                <input type="text" th:field="*{nombrePasajero}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control" th:required="${pasajeroForm.idPasajero == null}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Tipo</label>
                <select th:field="*{tipoPasajero}" class="form-select" required>
                    <option value="General">General</option>
                    <option value="Estudiante">Estudiante</option>
                    <option value="Adulto Mayor">Adulto Mayor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3" style="background-color: #3b82f6; border: none;">Procesar Pasajero</button>
        </div>
    </form>
</div>

        <hr style="border-color: var(--glass-border); margin-bottom: 30px;">

        <div class="card p-4 mb-5" style="background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 20px;">
            <form th:action="${pasajeroForm.idPasajero != null} ? @{/pasajeros/editar/{id}(id=${pasajeroForm.idPasajero})} : @{/pasajeros/agregar}"
                  th:object="${pasajeroForm}" method="post">
                <input type="hidden" th:field="*{idPasajero}" />

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text-color);"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" th:field="*{nombrePasajero}" placeholder="Ej: Juan Pérez" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text-color);"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="usuario@metro.com" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text-color);"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••"
                                   th:required="${pasajeroForm.idPasajero == null}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tipo de Pasajero</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text-color);"><i class="bi bi-tags"></i></span>
                            <select class="form-select form-control" th:field="*{tipoPasajero}" required>
                                <option value="">-- Seleccionar --</option>
                                <option value="General">General</option>
                                <option value="Estudiante">Estudiante</option>
                                <option value="Adulto Mayor">Adulto Mayor</option>
                                <option value="Discapacitado">Discapacitado</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-metro-main w-100 py-3 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${pasajeroForm.idPasajero != null} ? 'bi bi-arrow-repeat' : 'bi bi-person-fill-add'"></i>
                            <span th:text="${pasajeroForm.idPasajero != null} ? 'Guardar Cambios' : 'Registrar Pasajero'"></span>
                        </button>
                        <a th:if="${pasajeroForm.idPasajero != null}" th:href="@{/pasajeros}" class="d-block mt-3 text-center text-decoration-none" style="color: var(--text-soft);">
                            <i class="bi bi-x-circle"></i> Cancelar edición
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <form th:action="@{/pasajeros}" method="get" class="d-flex gap-2">
                    <input type="number" name="buscarId" class="form-control" placeholder="Buscar por ID..." required>
                    <button type="submit" class="btn btn-metro-main p-2 px-3">
                        <i class="bi bi-search"></i>
                    </button>
                    <a th:href="@{/pasajeros}" class="btn btn-outline-secondary d-flex align-items-center" style="border-radius: 10px;">
                        <i class="bi bi-eraser-fill"></i>
                    </a>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table-metro-style">
                <thead>
                <tr>
                    <th>ID & ROL</th>
                    <th>Nombre Completo</th>
                    <th>Correo Electrónico</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pasajero : ${pasajeros}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                                    <span style="background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-family: monospace; border: 1px solid var(--glass-border);"
                                          th:text="${'ID: ' + pasajero.idPasajero}"></span>
                            <span class="badge" style="background: var(--accent-grad);" th:text="${pasajero.tipo}"></span>
                        </div>
                    </td>
                    <td th:text="${pasajero.nombre}" class="fw-bold"></td>
                    <td th:text="${pasajero.email}" style="color: var(--text-soft);"></td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/pasajeros/editar/{id}(id=${pasajero.idPasajero})}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/pasajeros/borrar/{id}(id=${pasajero.idPasajero})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Eliminar permanentemente?')">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

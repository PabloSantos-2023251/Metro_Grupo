<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pasajeros - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/MetroFondo.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;">Gestión de Pasajeros</h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div class="container-fluid px-0">
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body p-4">
            <form th:action="@{/pasajeros/guardar}" th:object="${pasajeroForm}" method="post">
                <input type="hidden" th:field="*{idPasajero}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre del Pasajero</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person-badge text-primary"></i></span>
                            <input type="text" th:field="*{nombrePasajero}" class="form-control" placeholder="Ej: Juan Pérez" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope-at text-primary"></i></span>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="juan@correo.com" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-key text-primary"></i></span>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Seguridad" th:required="${pasajeroForm.idPasajero == null}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Tipo de Pasajero</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-tags text-primary"></i></span>
                            <select th:field="*{tipoPasajero}" class="form-select" required>
                                <option value="General">General</option>
                                <option value="Estudiante">Estudiante</option>
                                <option value="Adulto Mayor">Adulto Mayor</option>
                                <option value="Discapacitado">Discapacitado</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${pasajeroForm.idPasajero != null} ? 'bi bi-arrow-repeat' : 'bi bi-person-plus-fill'"></i>
                            <span th:text="${pasajeroForm.idPasajero != null} ? 'Actualizar Pasajero' : 'Registrar Pasajero'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/pasajeros/}" method="get" class="d-flex">
                <input type="number" name="buscarId" class="form-control me-2 shadow-sm" placeholder="Buscar por ID Pasajero...">
                <button type="submit" class="btn btn-metro-main d-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/pasajeros/}" class="btn btn-outline-secondary ms-2 d-flex align-items-center" title="Limpiar búsqueda">
                    <i class="bi bi-eraser-fill"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm" style="background: white; border-radius: 8px;">
        <table class="table table-hover mb-0">
            <thead style="background-color: #3a4e7a; color: white;">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Tipo</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pasajeros}">
                <td th:text="${p.idPasajero}" class="fw-bold"></td>
                <td th:text="${p.nombrePasajero}"></td>
                <td th:text="${p.email}" class="text-muted small"></td>
                <td>
                    <span class="badge bg-info-subtle text-info border border-info px-2 py-2"
                          th:text="${p.tipoPasajero}"></span>
                </td>
                <td class="text-center">
                    <a th:href="@{/pasajeros/editar/{id}(id=${p.idPasajero})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/pasajeros/borrar/{id}(id=${p.idPasajero})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar pasajero?')">
                        <i class="bi bi-trash3-fill"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pasajeros)}">
                <td colspan="5" class="text-center py-4 text-muted">No hay pasajeros registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

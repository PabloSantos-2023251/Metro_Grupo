<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>

<body>
<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2"
           style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver al Dashboard
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;"
            th:text="${pasajeroForm.idPasajero != null} ? 'Modificar Pasajero' : 'Gestión de Pasajeros'"></h2>
    </div>

    <hr>

    <div class="card p-4 mb-4">
        <form th:action="${pasajeroForm.idPasajero != null} ? @{/pasajeros/editar/{id}(id=${pasajeroForm.idPasajero})} : @{/pasajeros/agregar}"
              th:object="${pasajeroForm}" method="post">
        <input type="hidden" th:field="*{idPasajero}" />
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombrePasajero}" placeholder="Ej: Juan" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tipo</label>
                    <select class="form-select" th:field="*{tipoPasajero}" required>
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="general">General</option>
                        <option value="estudiante">Estudiante</option>
                        <option value="adulto mayor">Adulto Mayor</option>
                        <option value="discapacitado">Discapacitado</option>
                    </select>
                </div>
                <div class="col-12 mt-3 text-center">
                    <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                        <i th:class="${pasajeroForm.idPasajero != null} ? 'bi bi-arrow-repeat' : 'bi bi-person-fill-add'"></i>
                        <span th:text="${pasajeroForm.idPasajero != null} ? 'Guardar Cambios' : 'Agregar Pasajero'"></span>
                    </button>
                    <a th:if="${pasajeroForm.idPasajero != null}" th:href="@{/pasajeros}" class="btn-cancel-link d-block mt-2">Cancelar edición</a>
                </div>
            </div>
        </form>
    </div>

    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/pasajeros}" method="get" class="d-flex">
                <input type="number" name="buscarId" class="form-control me-2"
                       placeholder="Buscar por ID Pasajero..." required>
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i> Buscar
                </button>
                <a th:href="@{/pasajeros}" class="btn btn-outline-secondary ms-2 d-inline-flex align-items-center gap-1">
                    <i class="bi bi-eraser-fill"></i> Limpiar
                </a>
            </form>
        </div>
    </div>

    <p th:if="${mensajeVacio}" th:text="${mensajeVacio}" 
   style="color:red; font-weight:bold;"></p>

    <div class="table-responsive">
        <table class="table">
        <thead>
        <tr>
            <th>ID Pasajero</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pasajero : ${pasajeros}">
            <td th:text="${pasajero.idPasajero}"></td>
            <td th:text="${pasajero.nombre}"></td>
            <td th:text="${pasajero.tipo}"></td>
            <td class="text-center">
                <a th:href="@{/pasajeros/editar/{id}(id=${pasajero.idPasajero})}"
                   class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                    <i class="bi bi-pencil-square"></i> Editar
                </a>
                <a th:href="@{/pasajeros/borrar/{id}(id=${pasajero.idPasajero})}"
                   class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                   onclick="return confirm('¿Desea borrar este pasajero?')">
                    <i class="bi bi-trash3-fill"></i> Borrar
                </a>
            </td>
        </tr>
        </tbody>
            <tr th:if="${#lists.isEmpty(pasajeros)}">
                <td colspan="4" class="text-center py-4 text-muted">No se encontraron resultados.</td>
            </tr>
    </table>
    </div>
</body>

</html>

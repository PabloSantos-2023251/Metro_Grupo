<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/GeneralStyle.css}">
</head>
<body>

<div class="video-bg-wrapper">
    <video autoplay muted loop playsinline>
        <source th:src="@{/videos/Metro.mp4}" type="video/mp4">
    </video>
</div>

<div class="main-container-glass">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary d-inline-flex align-items-center gap-2" style="background-color: #3a4e7a; border: none;">
            <i class="bi bi-arrow-left-circle"></i> Volver al Dashboard
        </a>
        <h2 style="color: #091d36; font-weight: 700; margin: 0;"
            th:text="${editando} ? 'Modificar Personal' : 'Gestión de Personal'"></h2>
    </div>

    <hr style="border-top: 2px solid #c2d2e9; opacity: 1; margin-bottom: 25px;">

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong th:text="${mensajeError}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card mb-4 border-0 shadow-sm" style="background: rgba(241, 241, 240, 0.8);">
        <div class="card-body p-4">
            <form th:action="@{/api/personal/guardar}" th:object="${personalObj}" method="post">
                <input type="hidden" th:field="*{id_personal}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                            <input type="text" th:field="*{nombre}" class="form-control border-start-0" placeholder="Ej: Pablo Santos" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Email Corporativo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope-at-fill text-muted"></i></span>
                            <input type="email" th:field="*{email}" class="form-control border-start-0" placeholder="pablo@ejemplo.com" required>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Cargo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-briefcase-fill text-muted"></i></span>
                            <select th:field="*{cargo}" class="form-select border-start-0" required>
                                <option value="">Seleccione...</option>
                                <option value="Gerente">Gerente</option>
                                <option value="Conserje">Conserje</option>
                                <option value="Conductor">Conductor</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Rol de Sistema</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-lock-fill text-muted"></i></span>
                            <select th:field="*{rol}" class="form-select border-start-0" required>
                                <option value="">Seleccione...</option>
                                <option value="Gerente">Administrador</option>
                                <option value="Conserje">Empleado</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold" style="color: #3a4e7a;">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
                            <input type="text" th:field="*{password}" class="form-control border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-metro-main w-100 py-2 d-inline-flex justify-content-center align-items-center gap-2">
                            <i th:class="${editando} ? 'bi bi-pencil-square' : 'bi bi-person-plus-fill'"></i>
                            <span th:text="${editando} ? 'Actualizar Personal' : 'Registrar Personal'"></span>
                        </button>
                        <a th:if="${editando}" th:href="@{/api/personal}" class="btn btn-link text-decoration-none mt-2 d-block" style="color: #3a4e7a;">Cancelar edición</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-5">
            <form th:action="@{/api/personal}" method="get" class="d-flex shadow-sm rounded">
                <input type="text" name="buscar" th:value="${param.buscar}" class="form-control me-2" placeholder="Buscar por nombre o cargo...">
                <button type="submit" class="btn btn-metro-main d-inline-flex align-items-center gap-1">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="table-responsive table-metro-style shadow-sm">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Cargo</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${personalList}">
                <td th:text="${p.id_personal}" class="fw-bold text-muted"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.email}"></td>
                <td>
                    <span class="badge bg-light text-dark border">
                        <i class="bi bi-tag-fill me-1 text-primary"></i>
                        <span th:text="${p.cargo}"></span>
                    </span>
                </td>
                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a th:href="@{/api/personal/editar/{id}(id=${p.id_personal})}"
                           class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/api/personal/eliminar/{id}(id=${p.id_personal})}"
                           class="btn btn-sm btn-danger d-inline-flex align-items-center gap-1"
                           onclick="return confirm('¿Está seguro de eliminar a este empleado?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(personalList)}">
                <td colspan="5" class="text-center py-5 text-muted">
                    <i class="bi bi-people-fill d-block fs-1 mb-2"></i>
                    No se encontró personal registrado.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

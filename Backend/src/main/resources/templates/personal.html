<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container mt-4">
    <a th:href="@{/PaginaPrincipal}" class="btn btn-secondary mb-3">← Volver</a>

    <h2 th:text="${editando} ? 'Editar Personal' : 'Gestión de Personal'"></h2>
    <hr>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong th:text="${mensajeError}"></strong>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/api/personal/guardar}" th:object="${personalObj}" method="post">
                <input type="hidden" th:field="*{id_personal}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Pablo Santos" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="pablo@ejemplo.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-weight-bold">Cargo</label>
                        <select th:field="*{cargo}" class="form-select" required>
                            <option value="">Seleccione un cargo...</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Conserje">Conserje</option>
                            <option value="Conductor">Conductor</option>
                        </select>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success"
                                th:text="${editando} ? 'Actualizar Personal' : 'Guardar Personal'"></button>
                        <a th:if="${editando}" th:href="@{/api/personal}" class="btn btn-link text-decoration-none">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <form th:action="@{/api/personal}" method="get" class="d-flex gap-2">
                <input type="text" name="buscar" th:value="${param.buscar}" class="form-control" placeholder="🔍 Buscar por nombre, email o cargo...">
                <button type="submit" class="btn btn-primary">Filtrar</button>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover border">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Cargo</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${personalList}">
                <td th:text="${p.id_personal}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.email}"></td>
                <td th:text="${p.cargo}"></td>
                <td class="text-center">
                    <a th:href="@{/api/personal/editar/{id}(id=${p.id_personal})}"
                       class="btn btn-sm btn-warning">Editar</a>

                    <a th:href="@{/api/personal/eliminar/{id}(id=${p.id_personal})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Está seguro de eliminar a este empleado?')">Borrar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(personalList)}">
                <td colspan="5" class="text-center py-4 text-muted">No se encontró personal registrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
